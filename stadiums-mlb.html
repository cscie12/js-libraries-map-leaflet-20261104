<!doctype html>
<html lang="en">

<head>
    <title>Leaflet Map Example - MLB Stadiums</title>

    <!-- Leaflet CSS and JS from a CDN; "integrity" lets the browser verify the files weren't altered -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- main.css also sets the map's height and the marker colors for each division -->
    <link rel="stylesheet" href="styles/main.css" />
    <!-- type="module" scripts run after the HTML is parsed, so no DOMContentLoaded listener is needed -->
    <script type="module" src="scripts/stadiums-mlb.js"> </script>
</head>

<body>

    <header>
        <h1>MLB Stadiums</h1>
    </header>

    <main>
        <!-- Leaflet draws the map here; its height comes from #map in styles/main.css -->
        <div id="map"></div>
    </main>
    <footer>
		<p><a href="./">Examples</a> from <a href="https://cs12.net/">CSCI E-12</a> at <a href="https://extension.harvard.edu/">Harvard Extension School</a>.</p>
		<p>Sports stadium data is from <a
				href="https://www.kaggle.com/datasets/logandonaldson/sports-stadium-locations">logandonaldson on Kaggle</a> and is stored locally in <a href="data/stadiums.json"><code>data/stadiums.json</code></a>
		</p>
    </footer>

</body>

</html>
