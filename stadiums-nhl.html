<!doctype html>
<html lang="en">

<head>
    <title>Leaflet Map Example - NHL Stadiums</title>

    <!-- Leaflet loaded from a local copy in vendor/ instead of a CDN (works offline; no integrity check needed) -->
    <link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css" />
    <script src="vendor/leaflet-1.9.4/leaflet.js"></script>
    <!-- main.css also sets the map's height and the marker colors for each division -->
    <link rel="stylesheet" href="styles/main.css" />
    <!-- type="module" scripts run after the HTML is parsed, so no DOMContentLoaded listener is needed -->
    <script type="module" src="scripts/stadiums-nhl.js"> </script>
</head>

<body>

    <header>
        <h1>NHL Stadiums</h1>
    </header>

    <main>
        <!-- Leaflet draws the map here; its height comes from #map in main.css -->
        <div id="map"></div>
    </main>
    <footer>
		<p><a href="./">Examples</a> from <a href="https://cs12.net/">CSCI E-12</a> at <a href="https://extension.harvard.edu/">Harvard Extension School</a>.</p>
		<p>Sports stadium data is from <a
				href="https://www.kaggle.com/datasets/logandonaldson/sports-stadium-locations">logandonaldson on Kaggle</a> and is stored locally in <a href="data/stadiums.json"><code>data/stadiums.json</code></a>
		</p>
    </footer>

</body>

</html>
