<!doctype html>
<html lang="en">

<head>
    <title>JavaScript Map - Leaflet Examples</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="styles/main.css" />
    <script type="module" src="scripts/stadiums.js"> </script>
</head>

<body>

    <header>
        <h1><span id="leaguename"></span> Stadiums</h1>
    </header>

    <main>
        <form><label>Select league: <select id="league-options">
                    <option value="MLB">MLB</option>
                    <option value="MLS">MLS</option>
                    <option value="NBA">NBA</option>
                    <option value="NFL">NFL</option>
                    <option value="NHL">NHL</option>
                </select></label></form>
        <div id="map"></div>
    </main>
    <footer>
		<p><a href="./">Examples</a> from <a href="https://cs12.net/">CSCI E-12</a> at <a href="https://extension.harvard.edu/">Harvard Extension School</a>.</p>
		<p>Sports stadium data is from <a
				href="https://www.kaggle.com/datasets/logandonaldson/sports-stadium-locations">logandonaldson on Kaggle</a> and is stored locally in <a href="data/stadiums.json"><code>data/stadiums.json</code></a>
		</p>
    </footer>

</body>

</html>
