<!doctype html>
<html lang="en">

<head>
	<title>Leaflet Map Example</title>

	<!-- Leaflet CSS and JS from a CDN; "integrity" lets the browser verify the files weren't altered -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<link rel="stylesheet" href="styles/main.css" />
	<!-- Our map code; loaded after Leaflet because it uses the "L" object Leaflet defines -->
	<script src="scripts/harvard-yard.js"> </script>
</head>

<body>

	<h1>Harvard Yard</h1>
	<!-- Leaflet draws the map inside this element (matched by id). It needs a height to be visible, which is in styles/main.css -->
	<div id="map"></div>

	<footer>
		<p><a href="./">Examples</a> from <a href="https://cs12.net/">CSCI E-12</a> at <a
				href="https://extension.harvard.edu/">Harvard Extension School</a>.</p>
	</footer>

</body>

</html>
